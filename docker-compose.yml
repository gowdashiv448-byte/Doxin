name: doxin

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: doxin
      POSTGRES_USER: doxin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-doxin_dev_password}
    volumes:
      - doxin_pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doxin -d doxin"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "4000"
      HOST: 0.0.0.0
      DATABASE_URL: postgres://doxin_app:${APP_DB_PASSWORD:-doxin_app_dev_password}@db:5432/doxin
      MIGRATION_DATABASE_URL: postgres://doxin:${POSTGRES_PASSWORD:-doxin_dev_password}@db:5432/doxin
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-doxin_app_dev_password}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-please-32-characters-minimum}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@doxin.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Doxin@2026}
      SEED_PLATFORM_EMAIL: ${SEED_PLATFORM_EMAIL:-platform@doxin.com}
      SEED_PLATFORM_PASSWORD: ${SEED_PLATFORM_PASSWORD:-Platform@2026}
      SEED_SECOND_TENANT_NAME: ${SEED_SECOND_TENANT_NAME:-Northwind Logistics}
      SEED_SECOND_TENANT_SLUG: ${SEED_SECOND_TENANT_SLUG:-northwind}
      SEED_SECOND_TENANT_EMAIL: ${SEED_SECOND_TENANT_EMAIL:-admin@northwind.test}
      SEED_SECOND_TENANT_PASSWORD: ${SEED_SECOND_TENANT_PASSWORD:-Northwind@2026}
      SEED_STARTER_DATA: ${SEED_STARTER_DATA:-true}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "4000"

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  doxin_pgdata:
